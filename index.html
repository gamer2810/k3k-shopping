            foreground: 'var(--color-foreground)',

            // For easier migration/compatibility with old names if used directly
            // It's better to update components to use semantic names like 'card', 'background'
            base_100: 'var(--color-background)', 
            base_content: 'var(--color-foreground)',
            neutral: 'var(--color-muted-foreground)', // map tailwind neutral to our muted_foreground
          }
        }
      }
    }
  </script>
